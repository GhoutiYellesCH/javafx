plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '25.0.1'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media' ]
}

application {
    mainClass = 'com.example.App'
}

dependencies {
    // If you prefer to use the local JavaFX SDK, remove the org.openjfx dependencies
}

tasks.withType(JavaCompile) {
    options.release = 21
}
